name: Sitedesk Build and Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [webhook_update_from_sheets]
  workflow_dispatch:
    inputs:
      reason:
        description: Why this deployment was triggered
        required: false
        default: manual

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
      VITE_WORKER_BASE_URL: ${{ vars.VITE_WORKER_BASE_URL }}
      VITE_SITE_KEY: ${{ vars.VITE_SITE_KEY }}
      VITE_CF_IMAGE_MAIN_VARIANT: ${{ vars.VITE_CF_IMAGE_MAIN_VARIANT }}
      VITE_CF_IMAGE_THUMB_VARIANT: ${{ vars.VITE_CF_IMAGE_THUMB_VARIANT }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Prerender Script
        run: npm run build

      - name: Validate Cloudflare secrets
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_PAGES_PROJECT_NAME" || (echo "Missing CLOUDFLARE_PAGES_PROJECT_NAME" && exit 1)
          test -n "$VITE_WORKER_BASE_URL" || (echo "Missing VITE_WORKER_BASE_URL" && exit 1)
          test -n "$VITE_SITE_KEY" || (echo "Missing VITE_SITE_KEY" && exit 1)
          test -n "$VITE_CF_IMAGE_MAIN_VARIANT" || (echo "Missing VITE_CF_IMAGE_MAIN_VARIANT" && exit 1)
          test -n "$VITE_CF_IMAGE_THUMB_VARIANT" || (echo "Missing VITE_CF_IMAGE_THUMB_VARIANT" && exit 1)
          test -n "$VITE_STRIPE_PUBLISHABLE_KEY" || (echo "Missing VITE_STRIPE_PUBLISHABLE_KEY" && exit 1)

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@latest pages deploy dist --project-name="${CLOUDFLARE_PAGES_PROJECT_NAME}" --branch=main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
