name: Sitedesk Verify

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: Why this deployment was triggered
        required: false
        default: manual

concurrency:
  group: sitedesk-verify-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate site boundary
        run: npm run check:site-boundary

      - name: Run Prerender Script
        run: npm run build

      - name: Verify completed
        run: echo "Build + site-boundary checks passed. Cloudflare Pages handles deployment."
